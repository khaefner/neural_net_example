<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Feed-Forward & Backpropagation Visualization</h1>
            <div class="controls">
                <button id="btn-forward">Forward Pass</button>
                <button id="btn-backprop" disabled>Backpropagate</button>
                <button id="btn-reset">Reset Network</button>
                <div class="status-panel">Status: <span id="status-text">Idle. Click 'Forward Pass' to start.</span></div>
            </div>
        </div>

        <div class="network-container" id="network-container">
            <!-- 4x4 Input Matrix -->
            <div class="layer input-layer" id="input-layer">
                <div class="layer-title">Input Matrix (4x4)</div>
                <div class="matrix-grid" id="input-matrix">
                    <!-- 16 inputs generated by JS -->
                </div>
            </div>

            <!-- SVG for connecting lines (drawn via JS) -->
            <svg class="connections-svg" id="connections-svg"></svg>

            <!-- Weights Layer (4 rows of 16 sliders) -->
            <div class="layer weights-layer" id="weights-layer">
                <div class="layer-title">Weights (4 rows, 16 sliders each)</div>
                <div class="sliders-container" id="sliders-container">
                    <!-- 4 rows generated by JS -->
                </div>
            </div>

            <!-- SVG for second set of connecting lines (drawn via JS) -->
            <svg class="connections-svg-out" id="connections-svg-out"></svg>

            <!-- Output Layer (4 nodes) -->
            <div class="layer output-layer" id="output-layer">
                <div class="layer-title">Outputs (4 Nodes)</div>
                <div class="output-nodes" id="output-nodes">
                    <!-- 4 outputs generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Info Panel for showing targets and error -->
    <div class="info-panel" id="info-panel">
        <div class="info-box">
            <h3>Targets</h3>
            <div id="target-values"></div>
        </div>
        <div class="info-box">
            <h3>Current Error</h3>
            <div id="error-values"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
